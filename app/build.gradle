plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.dragontigerreader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.dragontigerreader'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
